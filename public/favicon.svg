<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 86" role="img" aria-label="Krishi Mitr">
  <!-- The same mark `src/components/ui/Logo.tsx` draws, as a standalone file.
       One difference on purpose: the disc is r=43 rather than r=41, so it fills
       the box edge to edge. A favicon sits on a browser tab of unknown colour,
       and transparent corners there read as a chipped icon. -->
  <circle cx="43" cy="43" r="43" fill="#9B2F00"/>
  <!-- The bridge: a shallow arch, not a semicircle — a semicircle reads as a
       rainbow and this has to read as a span. -->
  <path d="M22 58 Q43 36 64 58" stroke="#FFECE7" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- The stem, rising through the arch's crown. -->
  <path d="M43 56 L43 34" stroke="#FFECE7" stroke-width="5" stroke-linecap="round"/>
  <!-- Two leaves. At 16px the second one is barely a pixel wide, which is
       correct: it thins to texture rather than disappearing to a different
       drawing. -->
  <path d="M43 40 Q31 36 30 25 Q42 26 43 40Z" fill="#B9FFDE"/>
  <path d="M43 44 Q55 40 56 29 Q44 30 43 44Z" fill="#0F7C5B"/>
</svg>
