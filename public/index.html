<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9B2F00" />
    <meta
      name="description"
      content="Krishi Mitr — should I sell today or wait? Mandi prices, a plain-language verdict with both the gain and the worst case, and a voice that reads every screen aloud in Marathi, Hindi or English."
    />
    <title>Krishi Mitr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The app's own type family. On the phone these ship as bundled .ttf
         files; in the browser they come from Google Fonts, same faces. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #faf6ee;
        font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system,
          BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      /* The phone app's fontFamily tokens name one file per weight
         (PlusJakartaSans-Bold and so on, because Android matches by
         filename). In the browser there is one family with real weights, so
         each of those names maps back onto it. */
      [style*='PlusJakartaSans'] {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
