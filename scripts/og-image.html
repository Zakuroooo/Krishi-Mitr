<!DOCTYPE html>
<!--
  Source for `public/og-image.png` — the picture that appears when someone
  shares krishimitr.in in WhatsApp, which for this audience is how a link
  actually travels. Rendered to PNG at 1200×630 by `scripts/build-icons.sh`.

  It says the one sentence the product is about, in Marathi first, and shows
  both figures at the same size, because that rule holds in a link preview too.
-->
<html lang="mr">
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;700;800&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #FAF6EE;
    font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
    color: #1C1C17;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
    border-bottom: 14px solid #9B2F00;
  }
  .top { display: flex; align-items: center; gap: 22px; }
  .brand { font-size: 44px; font-weight: 800; color: #9B2F00; letter-spacing: -.02em; }
  .brand small { display: block; font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 22px; font-weight: 700; color: #4A342E; letter-spacing: 0; }
  h1 { font-family: 'Noto Sans Devanagari', sans-serif; font-size: 68px; font-weight: 800;
    line-height: 1.22; letter-spacing: -.01em; max-width: 15ch; }
  .sub { font-family: 'Noto Sans Devanagari', sans-serif; font-size: 27px; color: #4A342E; margin-top: 14px; max-width: 30ch; }
  .figures { display: flex; gap: 18px; }
  .fig { flex: 1; background: #FFFFFF; border: 1.5px solid #DCC9A8; border-radius: 18px; padding: 20px 26px; }
  .fig .label { font-family: 'Noto Sans Devanagari', sans-serif; font-size: 20px; color: #4A342E; }
  /* Identical size for both, deliberately — I16 holds in a link preview too. */
  .fig .value { font-size: 40px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; }
  .gain { color: #046C4E; } .risk { color: #B3261E; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .foot span { font-size: 21px; color: #8D7168; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <svg width="76" height="76" viewBox="0 0 86 86">
      <circle cx="43" cy="43" r="43" fill="#9B2F00"/>
      <path d="M22 58 Q43 36 64 58" stroke="#FFECE7" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M43 56 L43 34" stroke="#FFECE7" stroke-width="5" stroke-linecap="round"/>
      <path d="M43 40 Q31 36 30 25 Q42 26 43 40Z" fill="#B9FFDE"/>
      <path d="M43 44 Q55 40 56 29 Q44 30 43 44Z" fill="#0F7C5B"/>
    </svg>
    <div class="brand">Krishi Mitr<small>कृषी मित्र</small></div>
  </div>

  <div>
    <h1>आज विकू की थांबू?</h1>
    <div class="sub">खरा बाजारभाव, स्पष्ट सल्ला — आणि फायदा किती तसाच तोटा किती.</div>
  </div>

  <div class="figures">
    <div class="fig"><div class="label">अपेक्षित नफा (४० क्विं)</div><div class="value gain">+₹6,290</div></div>
    <div class="fig"><div class="label">सर्वात वाईट परिस्थिती</div><div class="value risk">−₹4,800</div></div>
  </div>

  <div class="foot">
    <span>krishimitr.in</span>
    <span>मराठी · हिंदी · English</span>
  </div>
</body>
</html>
